<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>MuleTrace AI | กำลังนำทางไป Dashboard...</title>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("muletrace_auth_session") !== "active") {
          window.location.replace("login.html");
          return;
        }
      } catch (e) {
        window.location.replace("login.html");
        return;
      }
      window.location.replace("../app/frontend/index.html");
    })();
  </script>
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f7f5f1; color: #25251f; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <div style="background: white; border: 1px solid #e9e5df; border-radius: 12px; padding: 32px; text-align: center; max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,0.04);">
    <h2 style="margin: 0 0 12px; color: #745b3e;">MuleTrace AI Dashboard</h2>
    <p style="margin: 0 0 18px; color: #777870;">กำลังนำทางไปยังแดชบอร์ด...</p>
    <a href="login.html" id="fallbackLink" style="display: inline-block; background: #9c7951; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">เข้าสู่ระบบ</a>
  </div>
  <script>
    try {
      if (sessionStorage.getItem("muletrace_auth_session") === "active") {
        var link = document.getElementById("fallbackLink");
        if (link) {
          link.href = "../app/frontend/index.html";
          link.textContent = "เปิด Dashboard";
        }
      }
    } catch (e) {}
  </script>
</body>
</html>

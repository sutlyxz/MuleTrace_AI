services:
  frontend:
    build: .
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    command: python -m http.server 8000 --bind 0.0.0.0 --directory app/frontend

  scanner:
    build: .
    profiles: [analysis]
    command: python -m app.backend.workers.auto_scanner --interval ${SCAN_INTERVAL:-3}
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./app/data:/workspace/app/data
